{% load static %}
<!-- CITIES GRID -->
    <section>

        <div class="row g-4">
            {% for city in cities %}
            <!-- CITY -->
            <div class="col-6 col-md-4 col-lg-3">

                <a href="{% url 'hotels:hotel_list' %}?city={{ city.id }}"
                   class="text-decoration-none">

                    <div class="card border rounded-5 overflow-hidden bg-transparent h-100">

                        <!-- IMAGE -->
                        <div class="bg-body-tertiary d-flex align-items-center justify-content-center"
                             style="height:220px;">

                            <img src="{% static 'images/Riyadh.jpg' %}"
                                 class="w-100 h-100 object-fit-cover"
                                 alt="{{ city.name }}">

                        </div>

                        <!-- CONTENT -->
                        <div class="card-body text-center">

                            <h5 class="fw-bold mb-1">
                                {{ city.name }}
                            </h5>

                        </div>

                    </div>

                </a>

            </div>
            {% empty %}
            <div class="text-center mt-5">
                <i class="bi bi-geo-alt-fill fs-1"></i>
                <p class="mt-2">No cities available.</p>
            </div>
            {% endfor %}
            

        </div>

    </section>
